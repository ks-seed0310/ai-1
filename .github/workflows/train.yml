name: 🚀 WebGPU AI Auto Training & Save (Split Binary)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  train-ai:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: 🟢 Node.js の環境をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ 自動学習を実行
        run: node train.js

      - name: 📦【100MB制限突破】バイナリを90MBずつに分割
        run: |
          split -b 90m weights.bin weights_part_
          rm weights.bin

      - name: 🚀【競合破壊】リポジトリに自動でコミット＆強制Push！
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add weights_part_*
          
          # コミットする変更があるか確認
          if ! git diff --quiet && ! git diff --staged --quiet; then
            git commit -m "🤖 AI: 分割バイナリ脳みそデータを更新"
            # ⭕【最重要】競合を防ぐために、Push直前に最新のリポジトリをpullして整列させる
            git pull --rebase origin main
            git push origin main
          else
            echo "変更がありません。Pushをスキップします。"
          fi
