name: 🚀 WebGPU AI Auto Training & Save (Binary)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  train-ai:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: 🟢 Node.js の環境をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ 6,700万パラメーターの自動学習を実行（爆速版）
        run: node train.js

      - name: 📦 賢くなった脳みそ（バイナリ）をリポジトリに自動でコミット＆Push！
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add weights.bin
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 AI: 爆速バイナリ脳みそデータ（weights.bin）を更新" && git push)
