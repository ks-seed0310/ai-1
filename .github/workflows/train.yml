name: 🚀 WebGPU AI Auto Training & Save (Split Binary)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  train-ai:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: 🟢 Node.js の環境をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ 自動学習を実行
        run: node train.js

      - name: ⭕【100MB制限突破】バイナリを90MBずつに小分けに分割
        run: |
          # 268MBのファイルを90MB単位で weights_part_aa, ab, ac に分割
          split -b 90m weights.bin weights_part_
          # 元のデカいファイルは削除してコミット対象外にする
          rm weights.bin

      - name: 📦 分割した脳みそデータをリポジトリに自動でコミット＆Push！
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add weights_part_*
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 AI: 分割バイナリ脳みそデータを更新" && git push)
